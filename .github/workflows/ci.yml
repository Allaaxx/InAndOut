name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Static verification - Lint check (Biome)
        run: pnpm run lint:check

      - name: Static verification - Type check (TypeScript)
        run: pnpm run typecheck

      - name: Static verification - Dependency audit (Knip)
        run: pnpm run audit:deps

      - name: Automated tests (Vitest)
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

      - name: Build smoke test artifacts assertion
        run: test -f dist/index.html && test -d dist/assets
