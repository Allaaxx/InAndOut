services:
  postgres:
    image: postgres:16-alpine
    container_name: inandout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inandout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inandout_pass}
      POSTGRES_DB: ${POSTGRES_DB:-inandout}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inandout_user} -d ${POSTGRES_DB:-inandout}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
