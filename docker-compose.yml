services:
  postgres:
    image: postgres:16-alpine
    container_name: inandout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inandout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inandout_pass}
      POSTGRES_DB: ${POSTGRES_DB:-inandout}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inandout_user} -d ${POSTGRES_DB:-inandout}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["app"]
    build: .
    container_name: inandout-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inandout_user}:${POSTGRES_PASSWORD:-inandout_pass}@postgres:5432/${POSTGRES_DB:-inandout}?schema=public
      PORT: 3000
      HOST: 0.0.0.0
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"

volumes:
  postgres_data:
